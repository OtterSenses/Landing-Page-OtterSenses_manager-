<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada — OtterSenses Manager</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
           font-family: system-ui, sans-serif; color: #fff; background: #0B1F2E; }
    h1 { font-size: 4rem; margin: 0; color: #14B8A6; }
    a { display: inline-block; margin-top: 1rem; padding: .6rem 1.4rem; border-radius: 8px;
        background: #14B8A6; color: #04211D; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Página não encontrada.</p>
    <a id="home" href="./">Voltar ao início</a>
  </main>
  <script>
    // Em páginas de projeto (usuario.github.io/repositorio/) a raiz do site é o primeiro segmento.
    var seg = location.pathname.split("/")[1];
    var base = location.hostname.endsWith(".github.io") && seg ? "/" + seg + "/" : "/";
    document.getElementById("home").href = base;
  </script>
</body>
</html>
